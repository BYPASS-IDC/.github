<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">BYPASS IDC — Independent Security Engineering</title>
  <desc id="desc">A deep-plum cyber engineering banner with a glowing shield mark, circuit traces, and a concise statement of the BYPASS IDC mission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#260b40"/><stop offset=".56" stop-color="#1b0532"/><stop offset="1" stop-color="#10021f"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5b1285"/><stop offset=".52" stop-color="#9227c9"/><stop offset="1" stop-color="#d7d1e4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9227c9" stop-opacity=".55"/><stop offset="1" stop-color="#9227c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a1555" stop-opacity=".92"/><stop offset="1" stop-color="#10021f" stop-opacity=".96"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9227c9" stroke-opacity=".13" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="440" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="440" rx="26" fill="url(#grid)"/>
  <ellipse cx="1110" cy="210" rx="390" ry="300" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="url(#purple)" stroke-width="2" opacity=".5">
    <path d="M700 58h170l38 38h115l35-35h300"/>
    <path d="M780 126h115l42 42h115l36-36h270"/>
    <path d="M750 320h140l40-40h130l38 38h270"/>
    <path d="M890 385h115l36-36h125l40 40h160"/>
    <path d="M1195 0v72l-42 42v95l42 42v87l-38 38v64"/>
  </g>
  <g fill="#9227c9" opacity=".9"><circle cx="870" cy="58" r="4"/><circle cx="1023" cy="96" r="4"/><circle cx="1052" cy="168" r="4"/><circle cx="1110" cy="280" r="4"/><circle cx="1205" cy="348" r="4"/><circle cx="1310" cy="320" r="4"/></g>
  <path d="M0 366H1400" stroke="#5b1285" stroke-opacity=".8"/><path d="M0 373H1400" stroke="#9227c9" stroke-opacity=".22"/>
  <g transform="translate(70 62)">
    <rect width="50" height="5" rx="2.5" fill="url(#purple)"/>
    <text x="0" y="38" fill="#d7d1e4" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="4">INDEPENDENT SECURITY ENGINEERING</text>
    <text x="-3" y="134" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">BYPASS IDC</text>
    <text x="1" y="183" fill="#d7d1e4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Build with intent. Analyze with context.</text>
    <text x="1" y="219" fill="#a99bbd" font-family="Arial, Helvetica, sans-serif" font-size="20">Practical security tools for developers and defenders.</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">
      <rect x="0" y="263" width="116" height="32" rx="7" fill="#5b1285" fill-opacity=".35" stroke="#9227c9" stroke-opacity=".85"/>
      <text x="58" y="284" text-anchor="middle" fill="#d7d1e4">[ BUILD ]</text>
      <rect x="128" y="263" width="142" height="32" rx="7" fill="#5b1285" fill-opacity=".25" stroke="#9227c9" stroke-opacity=".55"/>
      <text x="199" y="284" text-anchor="middle" fill="#d7d1e4">[ ANALYZE ]</text>
      <rect x="282" y="263" width="122" height="32" rx="7" fill="#5b1285" fill-opacity=".2" stroke="#9227c9" stroke-opacity=".4"/>
      <text x="343" y="284" text-anchor="middle" fill="#d7d1e4">[ DEFEND ]</text>
    </g>
    <text x="0" y="316" fill="#a99bbd" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">OPEN SOURCE  /  RESEARCH-DRIVEN  /  DEVELOPER-FIRST</text>
  </g>
  <g transform="translate(1030 86)" filter="url(#soft)">
    <circle cx="145" cy="125" r="140" fill="none" stroke="#9227c9" stroke-opacity=".22" stroke-width="2" stroke-dasharray="3 10"/>
    <circle cx="145" cy="125" r="115" fill="none" stroke="#d7d1e4" stroke-opacity=".12" stroke-width="1"/>
    <path d="M145 4L259 45V139c0 91-54 148-114 182C85 287 31 230 31 139V45z" fill="url(#glass)" stroke="#9227c9" stroke-width="4"/>
    <path d="M145 38L225 67V137c0 64-36 109-80 139-44-30-80-75-80-139V67z" fill="none" stroke="#d7d1e4" stroke-opacity=".64" stroke-width="2.2"/>
    <path d="M102 143l29 29 62-72" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M145 4V-22M31 139H-6M259 139h37" stroke="#9227c9" stroke-width="2" opacity=".7"/>
    <circle cx="145" cy="-22" r="4" fill="#d7d1e4"/><circle cx="-6" cy="139" r="4" fill="#9227c9"/><circle cx="296" cy="139" r="4" fill="#9227c9"/>
  </g>
  <text x="70" y="416" fill="#a99bbd" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">BYPASS-IDC  //  OPEN SECURITY TOOLING</text>
  <text x="1330" y="416" text-anchor="end" fill="#a99bbd" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">[ BUILD / ANALYZE / DEFEND ]</text>
  <rect x="0" y="0" width="1400" height="5" rx="2" fill="url(#purple)"/>
</svg>

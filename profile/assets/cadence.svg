  <text x="28" y="73" fill="#9227c9" font-family="Consolas, monospace" font-size="10.5" letter-spacing="1.2">DAYS SINCE LAST PUSH  /  ONE LATEST-PUSH DATE PER PUBLIC REPOSITORY</text><rect x="30.00" y="119" width="1140.00" height="28" fill="#9227c9"/><rect x="38" y="180" width="11" height="11" rx="3" fill="#9227c9"/><text x="59" y="190" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">0–7 days</text><text x="388" y="190" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">2 repos</text><rect x="428" y="180" width="11" height="11" rx="3" fill="#bc82e5"/><text x="449" y="190" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">8–30 days</text><text x="778" y="190" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">0 repos</text><rect x="818" y="180" width="11" height="11" rx="3" fill="#5b1285"/><text x="839" y="190" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">31–90 days</text><text x="1168" y="190" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">0 repos</text><rect x="38" y="218" width="11" height="11" rx="3" fill="#7b55a4"/><text x="59" y="228" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">91–180 days</text><text x="388" y="228" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">0 repos</text><rect x="428" y="218" width="11" height="11" rx="3" fill="#4b2a66"/><text x="449" y="228" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">&gt; 180 days</text><text x="778" y="228" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">0 repos</text><rect x="818" y="218" width="11" height="11" rx="3" fill="#776488"/><text x="839" y="228" fill="#d7d1e4" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal">No push date</text><text x="1168" y="228" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal">0 repos</text><text x="1165" y="265" fill="#a99bbd" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal">2 public repositories</text></svg>
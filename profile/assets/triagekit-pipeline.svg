<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
  <title id="title">TriageKit analysis pipeline</title>
  <desc id="desc">A five-stage, illustrative workflow: collect repository and pull-request inputs, analyze source, enrich with dependency intelligence, prioritize correlated risk, and deliver actionable results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#260b40"/><stop offset="1" stop-color="#10021f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5b1285"/><stop offset=".55" stop-color="#9227c9"/><stop offset="1" stop-color="#d7d1e4"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9227c9" stroke-opacity=".09"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="350" rx="22" fill="url(#bg)" stroke="#5b1285" stroke-width="1.5"/>
  <rect width="1400" height="350" rx="22" fill="url(#grid)"/>
  <text x="36" y="42" fill="#9227c9" font-family="Consolas, monospace" font-size="13" letter-spacing="3">TRIAGEKIT  /  FROM RAW SIGNAL TO ACTIONABLE TRIAGE</text>
  <text x="1360" y="42" text-anchor="end" fill="#a99bbd" font-family="Consolas, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE WORKFLOW</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(30 86)"><rect width="236" height="190" rx="14" fill="#260b40" stroke="#5b1285"/><rect width="236" height="5" rx="2" fill="url(#accent)"/><circle cx="30" cy="38" r="16" fill="#9227c9" fill-opacity=".15" stroke="#9227c9"/><text x="30" y="43" text-anchor="middle" fill="#d7d1e4" font-family="Consolas, monospace" font-size="12" font-weight="700">01</text><text x="22" y="91" fill="#ffffff" font-size="21" font-weight="700">COLLECT</text><text x="22" y="124" fill="#d7d1e4" font-size="14">Repositories &amp; PRs</text><text x="22" y="148" fill="#a99bbd" font-size="13">Source · changes · target</text><text x="22" y="169" fill="#a99bbd" font-size="13">Authorized web scope</text></g>
    <g transform="translate(311 86)"><rect width="236" height="190" rx="14" fill="#260b40" stroke="#5b1285"/><rect width="236" height="5" rx="2" fill="url(#accent)"/><circle cx="30" cy="38" r="16" fill="#9227c9" fill-opacity=".15" stroke="#9227c9"/><text x="30" y="43" text-anchor="middle" fill="#d7d1e4" font-family="Consolas, monospace" font-size="12" font-weight="700">02</text><text x="22" y="91" fill="#ffffff" font-size="21" font-weight="700">ANALYZE</text><text x="22" y="124" fill="#d7d1e4" font-size="14">Static + heuristic</text><text x="22" y="148" fill="#a99bbd" font-size="13">Language-aware analysis</text><text x="22" y="169" fill="#a99bbd" font-size="13">Taint data flows</text></g>
    <g transform="translate(592 86)"><rect width="236" height="190" rx="14" fill="#260b40" stroke="#5b1285"/><rect width="236" height="5" rx="2" fill="url(#accent)"/><circle cx="30" cy="38" r="16" fill="#9227c9" fill-opacity=".15" stroke="#9227c9"/><text x="30" y="43" text-anchor="middle" fill="#d7d1e4" font-family="Consolas, monospace" font-size="12" font-weight="700">03</text><text x="22" y="91" fill="#ffffff" font-size="21" font-weight="700">ENRICH</text><text x="22" y="124" fill="#d7d1e4" font-size="14">OSV dependency intel</text><text x="22" y="148" fill="#a99bbd" font-size="13">Advisory context</text><text x="22" y="169" fill="#a99bbd" font-size="13">Related finding signals</text></g>
    <g transform="translate(873 86)"><rect width="236" height="190" rx="14" fill="#260b40" stroke="#5b1285"/><rect width="236" height="5" rx="2" fill="url(#accent)"/><circle cx="30" cy="38" r="16" fill="#9227c9" fill-opacity=".15" stroke="#9227c9"/><text x="30" y="43" text-anchor="middle" fill="#d7d1e4" font-family="Consolas, monospace" font-size="12" font-weight="700">04</text><text x="22" y="91" fill="#ffffff" font-size="21" font-weight="700">PRIORITIZE</text><text x="22" y="124" fill="#d7d1e4" font-size="14">Risk scoring</text><text x="22" y="148" fill="#a99bbd" font-size="13">Finding correlation</text><text x="22" y="169" fill="#a99bbd" font-size="13">AI-assisted reasoning</text></g>
    <g transform="translate(1154 86)"><rect width="216" height="190" rx="14" fill="#260b40" stroke="#9227c9" stroke-width="1.6"/><rect width="216" height="5" rx="2" fill="url(#accent)"/><circle cx="30" cy="38" r="16" fill="#9227c9" fill-opacity=".22" stroke="#d7d1e4"/><text x="30" y="43" text-anchor="middle" fill="#ffffff" font-family="Consolas, monospace" font-size="12" font-weight="700">05</text><text x="22" y="91" fill="#ffffff" font-size="21" font-weight="700">DELIVER</text><text x="22" y="124" fill="#d7d1e4" font-size="14">PR triage &amp; reports</text><text x="22" y="148" fill="#a99bbd" font-size="13">Concrete next steps</text><text x="22" y="169" fill="#a99bbd" font-size="13">Developer-ready context</text></g>
  </g>
  <g stroke="#9227c9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M273 181h29m-8-7 8 7-8 7"/><path d="M554 181h29m-8-7 8 7-8 7"/><path d="M835 181h29m-8-7 8 7-8 7"/><path d="M1116 181h29m-8-7 8 7-8 7"/></g>
  <text x="36" y="322" fill="#a99bbd" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">ANALYSIS CAPABILITIES SHOWN AT A HIGH LEVEL — DETAILS AND SCOPE ARE DOCUMENTED IN THE PROJECT</text>
</svg>
